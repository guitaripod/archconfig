    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: presearch
    disabled: false
  - name: wikipedia
    disabled: false

ui:
  static_use_hash: true
