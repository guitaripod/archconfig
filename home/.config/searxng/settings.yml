use_default_settings: true

general:
  instance_name: "arch search"

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 900
    SearxEngineCaptcha: 900
    SearxEngineTooManyRequests: 300
    cf_SearxEngineCaptcha: 900
    cf_SearxEngineAccessDenied: 900
    recaptcha_SearxEngineCaptcha: 900

engines:
