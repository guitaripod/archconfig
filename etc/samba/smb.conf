[global]
   workgroup = WORKGROUP
   security = user
   log level = 1
   log file = /var/log/samba/%m.log
   max log size = 50
   server min protocol = SMB3
   restrict anonymous = 2
   map to guest = never
   hosts allow = 127.0.0.1 ::1 100.64.0.0/10 fd7a:115c:a1e0::/48
   hosts deny = ALL

[arch]
   path = /
   browseable = yes
   writable = yes
   valid users = marcus
   force user = marcus
   create mask = 0644
   directory mask = 0755
